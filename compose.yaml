services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: releasemanager
      POSTGRES_USER: releasemanager
      POSTGRES_PASSWORD: releasemanager
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releasemanager -d releasemanager"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    profiles: ["full"]
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/releasemanager
      DATABASE_USERNAME: releasemanager
      DATABASE_PASSWORD: releasemanager
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
