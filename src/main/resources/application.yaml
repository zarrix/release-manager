spring:
  application:
    name: release-manager
  datasource:
    url: jdbc:h2:mem:releasemanager;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/releasemanager}
    username: ${DATABASE_USERNAME:releasemanager}
    password: ${DATABASE_PASSWORD:releasemanager}
